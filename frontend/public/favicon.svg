<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ícone geométrico moderno - cubo/caixa estilizada -->
  <g transform="translate(4, 8)">
    <!-- Face frontal -->
    <path d="M10 15 L25 7 L25 23 L10 31 Z" fill="url(#gradient1)" opacity="0.9"/>
    <!-- Face direita -->
    <path d="M25 7 L40 15 L40 31 L25 23 Z" fill="url(#gradient2)" opacity="0.8"/>
    <!-- Face superior -->
    <path d="M10 15 L25 7 L40 15 L25 23 Z" fill="url(#gradient3)"/>
    <!-- Detalhe interno -->
    <line x1="25" y1="7" x2="25" y2="23" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Gradientes -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
